[workspace]
members = [
    "crates/refscape-model",
    "crates/refscape-analysis",
    "crates/refscape-canvas",
    "crates/refscape-application",
    "crates/refscape-lsp",
    "crates/refscape-language-support",
    "crates/refscape-language-rust",
    "crates/refscape-language-cpp",
    "crates/refscape-language-typescript",
    "crates/refscape-language-python",
    "crates/refscape-language",
    "crates/refscape-storage",
    "crates/refscape-ui",
    "crates/refscape-app",
]
default-members = ["crates/refscape-app"]
exclude = ["xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
refscape-model = { path = "crates/refscape-model" }
refscape-analysis = { path = "crates/refscape-analysis" }
refscape-language-support = { path = "crates/refscape-language-support" }
refscape-canvas = { path = "crates/refscape-canvas" }
refscape-application = { path = "crates/refscape-application" }
refscape-lsp = { path = "crates/refscape-lsp" }
refscape-language-rust = { path = "crates/refscape-language-rust" }
refscape-language-cpp = { path = "crates/refscape-language-cpp" }
refscape-language-typescript = { path = "crates/refscape-language-typescript" }
refscape-language-python = { path = "crates/refscape-language-python" }
refscape-language = { path = "crates/refscape-language" }
refscape-storage = { path = "crates/refscape-storage" }
refscape-ui = { path = "crates/refscape-ui" }
refscape-app = { path = "crates/refscape-app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
mod_module_files = "deny"
