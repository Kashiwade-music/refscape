[workspace]
members = [
    "crates/refscape-model",
    "crates/refscape-application",
    "crates/refscape-language",
    "crates/refscape-storage",
    "crates/refscape-ui",
    "crates/refscape-app",
]
default-members = ["crates/refscape-app"]
exclude = ["xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
refscape-model = { path = "crates/refscape-model" }
refscape-application = { path = "crates/refscape-application" }
refscape-language = { path = "crates/refscape-language" }
refscape-storage = { path = "crates/refscape-storage" }
refscape-ui = { path = "crates/refscape-ui" }
refscape-app = { path = "crates/refscape-app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
mod_module_files = "deny"
