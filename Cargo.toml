[workspace]
members = [
    "crates/refscape-model",
    "crates/refscape-application",
    "crates/refscape-language",
    "crates/refscape-storage",
    "crates/refscape-ui",
    "crates/refscape-app",
]
default-members = ["crates/refscape-app"]
exclude = ["xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
refscape-model = { path = "crates/refscape-model" }
refscape-application = { path = "crates/refscape-application" }
refscape-language = { path = "crates/refscape-language" }
refscape-storage = { path = "crates/refscape-storage" }
refscape-ui = { path = "crates/refscape-ui" }
refscape-app = { path = "crates/refscape-app" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "f8c2cc844057540ca1eac7de4f19f50d7597dead" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f8c2cc844057540ca1eac7de4f19f50d7597dead", features = ["font-kit", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
