[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

# Deliberately independent of the product's dependency resolution.
[workspace]
resolver = "3"

[dependencies]
cargo_metadata = "0.23.1"
toml = "0.9.12"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
mod_module_files = "deny"
